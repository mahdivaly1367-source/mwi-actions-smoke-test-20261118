name: MWI Cloud Runner Health Ledger

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mwi-cloud-runner-health-ledger
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out runner infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runtime versions
        run: |
          set -euo pipefail
          python3 --version
          git --version

      - name: Verify heartbeat ledger unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Probe private archive connection
        if: vars.MWI_ARCHIVE_CONNECTIVITY_ENABLED == 'true'
        env:
          MWI_ARCHIVE_TOKEN: ${{ secrets.MWI_ARCHIVE_TOKEN }}
          MWI_ARCHIVE_REPOSITORY: mahdivaly1367-source/mwi-research-data-archive
        run: python3 scripts/archive_connectivity_probe.py

      - name: Validate synthetic archive format and write integration report
        if: github.event_name == 'workflow_dispatch' && vars.MWI_ARCHIVE_CONNECTIVITY_ENABLED == 'true'
        env:
          MWI_ARCHIVE_TOKEN: \${{ secrets.MWI_ARCHIVE_TOKEN }}
          MWI_ARCHIVE_REPOSITORY: mahdivaly1367-source/mwi-research-data-archive
        run: python3 scripts/synthetic_archive_validation.py

      - name: Append public infrastructure heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/runner_heartbeat.py
