name: Public runner smoke test

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_RUNNER_SMOKE=START"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "UTC_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          test -n "$RUNNER_NAME"
          echo "PUBLIC_RUNNER_SMOKE=PASS"